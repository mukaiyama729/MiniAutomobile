[workspace]
resolver = "2"
members = [
  "crates/robot-adapter/protocol",
  "crates/robot-domain",
  "crates/robot-application",
  "crates/robot-state",
  "crates/robot-device-manager",
  "crates/robot-adapter/cli",
  "crates/robot-adapter/drivers/pico-usb",
  "apps/robot-cli",
]
exclude = ["crates/robot-adapter/firmware/pico-motor"]

[workspace.dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }
