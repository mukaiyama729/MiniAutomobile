[package]
name = "pico-motor"
version = "0.1.0"
edition = "2024"
build = "build.rs"

# Independent embedded workspace so host builds never target the RP2350.
[workspace]

[dependencies]
rp235x-hal = { version = "0.4", features = ["rt", "critical-section-impl"] }
embedded-hal = "1.0"
usb-device = "0.3.2"
usbd-serial = "0.2.2"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
robot-protocol = { path = "../../crates/robot-protocol" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
